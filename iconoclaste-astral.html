<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iconoclaste</title><style>

.planet{position:absolute;left:calc(50% + var(--x));top:calc(50% + var(--y));width:var(--size);height:var(--size);transition:left 1.5s cubic-bezier(.16,1,.3,1),top 1.5s cubic-bezier(.16,1,.3,1);z-index:2}.planet i{display:block;width:100%;height:100%;border-radius:50%;animation:drift var(--duration,8s) ease-in-out infinite;animation-delay:var(--delay,0s);background:radial-gradient(circle at 28% 20%,#655d72,#24202d 55%,#100c16 83%);box-shadow:inset -8px -12px 18px #05020a80,10px 20px 35px #0004}.planet.one{--x:-180px;--y:32px;--size:84px;--duration:7s}.planet.two{--x:-66px;--y:-90px;--size:54px;--delay:-3s}.planet.three{--x:50px;--y:89px;--size:58px;--delay:-6s}.planet.three i{background:radial-gradient(circle at 28% 20%,#fff,#d7c9e7 57%,#8d7ba1);box-shadow:inset -4px -6px 8px #5f437822,0 0 30px #c6adf218}.planet.four{--x:115px;--y:-163px;--size:143px;--duration:11s;--delay:-3s}.planet.four i{background:radial-gradient(circle at 28% 20%,#dfc2ff,#9a5cd6 48%,#4c2775 86%);box-shadow:inset -6px -10px 18px #180c4255,0 0 65px #7a38bf29,15px 25px 35px #0003}.planet.five{--x:-305px;--y:-111px;--size:19px;--delay:-2s}.planet.five i{background:#ab8ccb}.satellite{position:absolute;left:calc(50% - 183px);top:calc(50% - 183px);width:366px;height:366px;animation:turn 35s linear infinite}.satellite:before{content:'';position:absolute;left:12%;top:12%;width:6px;height:6px;background:#a579d7;border-radius:50%;box-shadow:0 0 15px #c493f0}

.expand-icon{position:absolute;bottom:13px;left:calc(50% - 18px);width:36px;height:36px;border:1px solid var(--line);border-radius:50%;color:var(--muted);transition:transform .6s,background .3s}.expand-icon:before,.expand-icon:after{content:'';height:1px;width:12px;position:absolute;left:11px;top:17px;background:currentColor}.expand-icon:after{transform:rotate(90deg)}.system:hover .expand-icon{background:var(--surface);color:var(--accent)}.system[aria-expanded=true] .expand-icon{transform:rotate(45deg)}

@keyframes drift{50%{transform:translate(5px,-18px)}}@keyframes turn{to{transform:rotate(360deg)}}@keyframes breathe{to{transform:scale(1.1);opacity:.5}}@keyframes twinkle{to{opacity:.7}}@keyframes blink{0%,42%,45%,94%,98%,100%{transform:scaleY(1)}43%,96%{transform:scaleY(.025)}97%{transform:scaleY(.4)}}
@media(min-width:1600px){.shell{max-width:1240px}.orbit-section{height:690px}}
@media(max-width:700px){.shell{padding:28px 24px 55px}.handle{font-size:22px}.identity{gap:12px}.mascot{width:46px;height:46px}.mascot .eye-drawing{width:45px;height:35px}.borderless{font-size:10px;align-items:flex-start;max-width:230px}.borderless>span:last-child{max-width:190px}.theme{flex-shrink:0;margin-left:14px}.theme{width:36px;height:36px}.orbit-section{height:480px;margin-top:10px;overflow:visible}.system{height:470px}.sculpture{transform:scale(.65)}.revelation{font-size:clamp(28px,7.7vw,51px);letter-spacing:-.055em;white-space:nowrap}.rank-section{grid-template-columns:1fr;padding:38px 0 10px;gap:15px}.rank-values{gap:20px}.dan{font-size:54px}.elo{font-size:19px}.sparkline{height:125px}.games-section{margin-top:25px;padding:35px 0 75px}.games{font-size:25px;line-height:1.8}.system .expand-icon{bottom:16px}.games-section:before{right:10px;width:85px;height:85px}}
@media(max-width:390px){.shell{padding-inline:18px}.handle{font-size:20px}.borderless{font-size:9px}.sculpture{transform:scale(.51)}.orbit-section{height:420px}.system{height:410px}.revelation{font-size:28px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation:none!important;transition:none!important}.depth,.sky,.content{transform:none!important}}
</style></head><body>
<div class="sky" aria-hidden="true"><div class="stars far"></div><div class="stars near"></div></div>
<main class="shell">
<header class="masthead"><div class="identity"><div class="mascot" aria-hidden="true"><svg class="eye-drawing" viewBox="0 0 64 48"><defs><radialGradient id="iris-color"><stop stop-color="#d3b1f5"/><stop offset=".52" stop-color="#9e68cb"/><stop offset="1" stop-color="#4f2a70"/></radialGradient><linearGradient id="eye-white" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#d7c9eb"/></linearGradient><clipPath id="eye-window"><path d="M6 24C20 5 44 5 58 24C44 42 20 42 6 24Z"/></clipPath></defs><g transform="rotate(-14 32 24)"><g class="eye-blink"><path d="M6 24C20 5 44 5 58 24C44 42 20 42 6 24Z" fill="url(#eye-white)" stroke="var(--lash)" stroke-width="1"/><g clip-path="url(#eye-window)"><g class="iris"><circle cx="32" cy="24" r="11" fill="url(#iris-color)" stroke="#51316d" stroke-width="1.2"/><circle cx="32" cy="24" r="6" fill="none" stroke="#d7b2f1" stroke-width="2" stroke-dasharray="1 2"/><circle cx="32" cy="24" r="4.7" fill="#170e24"/><circle cx="28.8" cy="20.5" r="2.5" fill="white"/></g></g><path class="eyelashes" d="M13 17Q9 14 8 10M22 11Q19 7 20 3M32 10V2M42 11Q46 7 45 3M51 17Q56 14 57 10M17 34l-3 4M46 34l3 4"/></g></g></svg></div><div><h1 class="handle">iconoclaste</h1><div class="borderless"><span class="flag" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#fff" stroke="#18121e" stroke-width=".7"/><path d="M12 1a11 11 0 0 1 0 22a5.5 5.5 0 0 1 0-11a5.5 5.5 0 0 0 0-11Z" fill="#18121e"/><circle cx="12" cy="6.5" r="1.7" fill="#18121e"/><circle cx="12" cy="17.5" r="1.7" fill="#fff"/></svg></span><span>I don't believe in borders. I prefer harmony.</span></div></div></div><button class="theme" type="button" aria-label="Switch to light theme" aria-pressed="false"><svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 1v3m0 16v3M1 12h3m16 0h3M4.2 4.2l2.1 2.1m11.4 11.4 2.1 2.1M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg><svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.5A9 9 0 0 1 8.5 4a9 9 0 1 0 11.5 11.5Z"/></svg></button></header>
<section class="orbit-section" aria-label="Interactive planet system"><button class="system" type="button" aria-expanded="false" aria-label="Expand the planet system"><span class="depth" aria-hidden="true"><span class="sculpture"><span class="nebula"></span><span class="ring"></span><span class="orbit"></span><span class="orbit two"></span><span class="grid"></span><span class="satellite"></span><span class="planet one"><i></i></span><span class="planet two"><i></i></span><span class="planet three"><i></i></span><span class="planet four"><i></i></span><span class="planet five"><i></i></span></span></span><span class="revelation" aria-hidden="true"><span>Beyond</span> <em>perception.</em></span><span class="expand-icon" aria-hidden="true"></span></button></section>
<div class="content"><section class="rank-section" aria-label="Global 19 by 19 rating"><div><h2 class="eyebrow">19 × 19 · Global</h2><div class="rank-values"><span class="dan" id="dan">—</span><span class="elo"><span id="elo">—</span><small>ELO</small></span></div><span class="error" id="rank-error"></span></div><div class="chart-wrap"><svg class="sparkline" viewBox="0 0 600 160" preserveAspectRatio="none" role="img" aria-label="Global 19 by 19 rating history"><title>Global 19 by 19 rating history</title><path id="rating-line" d=""/></svg><span class="history-error" id="history-error"></span></div></section>
<section class="games-section" aria-labelledby="games-heading"><h2 class="eyebrow" id="games-heading">Last games</h2><div class="games" id="games" aria-live="polite"><span class="error">Loading…</span></div></section><svg class="end-star" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 0 12 8 20 10 12 12 10 20 8 12 0 10 8 8Z" fill="currentColor"/></svg></div>
</main>
<script>
(function (root) {
    "use strict";

    const PLAYER_ID = 2117847;
    const OGS_ORIGIN = "https://online-go.com";
    const ENDPOINTS = Object.freeze({
        profile: `${OGS_ORIGIN}/api/v1/players/${PLAYER_ID}/full`,
        games: `${OGS_ORIGIN}/api/v1/players/${PLAYER_ID}/game_history/?page_size=10&ordering=-ended&annulled=false`,
        history: "./iconoclaste-history.json?series=19x19",
    });

    // OGS uses Glicko-2 ratings and this conversion for the displayed rank.
    // Source: online-go/online-go.com, src/lib/rank_utils.ts.
    function rankLabel(rating) {
        if (!Number.isFinite(rating)) throw new Error("The global 19×19 rating is unavailable.");
        const rank = Math.min(38, Math.max(5, Math.log(Math.min(6000, Math.max(100, rating)) / 525) * 23.15));
        return rank >= 30
            ? `${(Math.floor((rank - 29) * 10) / 10).toFixed(1)} dan`
            : `${(Math.ceil((30 - rank) * 10) / 10).toFixed(1)} kyu`;
    }

    function parseProfile(payload) {
        const user = payload && payload.user;
        if (!user || Number(user.id) !== PLAYER_ID || typeof user.username !== "string") {
            throw new Error("OGS returned an unexpected player profile.");
        }
        // OGS getUserRating(user, "overall", 19) uses "19x19" for all speeds.
        // Do not substitute rapid, the all-board overall rating, or another size.
        const rating = user.ratings && user.ratings["19x19"];
        if (!rating || typeof rating.rating !== "number" || !Number.isFinite(rating.rating)) {
            throw new Error("The global 19×19 rating is unavailable.");
        }
        return { username: user.username, dan: rankLabel(rating.rating), elo: Math.round(rating.rating) };
    }

    function playerColor(game) {
        if (game.rengo) {
            if (Array.isArray(game.rengo_black_team) && game.rengo_black_team.includes(PLAYER_ID)) return "black";
            if (Array.isArray(game.rengo_white_team) && game.rengo_white_team.includes(PLAYER_ID)) return "white";
        }
        if (Number(game.players && game.players.black && game.players.black.id) === PLAYER_ID) return "black";
        if (Number(game.players && game.players.white && game.players.white.id) === PLAYER_ID) return "white";
        throw new Error("OGS returned a game without this player.");
    }

    // Cancelled games can be identified by either the annulment flag or outcome.
    // Filter them before validation and the ten-game limit, so they never appear as losses.
    function parseGames(payload) {
        if (!payload || !Array.isArray(payload.results)) throw new Error("The recent games are unavailable.");
        return payload.results.filter(game => game && game.ended && !game.annulled &&
            !/\b(?:cancelled|canceled|cancellation|annulled|annulment)\b/i.test(String(game.outcome || ""))).map(game => {
            const color = playerColor(game);
            const opponentColor = color === "black" ? "white" : "black";
            const historical = game.historical_ratings && game.historical_ratings[opponentColor];
            const opponent = historical && typeof historical.username === "string"
                ? historical : game.players && game.players[opponentColor];
            const id = Number(game.id);
            const ended = new Date(game.ended);
            if (!opponent || typeof opponent.username !== "string" || !Number.isSafeInteger(id) || id <= 0 || !Number.isFinite(ended.getTime())) {
                throw new Error("OGS returned an incomplete recent game.");
            }
            const ownLoss = game[`${color}_lost`];
            const opponentLoss = game[`${opponentColor}_lost`];
            return {
                name: opponent.username,
                url: `${OGS_ORIGIN}/game/${id}`,
                win: ownLoss === false && opponentLoss === true,
                annulled: false,
                date: ended.toISOString(),
            };
        }).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 10);
    }

    // The official history endpoint is a TSV with Unix-second timestamps.
    // Only numeric ended/rating columns are read, so quoted JSON in extra does not matter.
    function parseHistory(tsv) {
        if (typeof tsv !== "string") throw new Error("The global 19×19 history is unavailable.");
        const lines = tsv.replace(/^\uFEFF/, "").trim().split(/\r?\n/);
        const headers = lines.shift().split("\t");
        const dateIndex = headers.indexOf("ended");
        const ratingIndex = headers.indexOf("rating");
        if (dateIndex < 0 || ratingIndex < 0) throw new Error("OGS returned an unexpected rating history.");
        return lines.filter(line => line.trim()).map(line => {
            const values = line.split("\t");
            const seconds = Number(values[dateIndex]);
            const rating = Number(values[ratingIndex]);
            const date = new Date(seconds * 1000);
            if (!values[dateIndex] || !values[ratingIndex] || !Number.isFinite(rating) || !Number.isFinite(date.getTime())) {
                throw new Error("OGS returned an incomplete rating history.");
            }
            return { date: date.toISOString(), rating };
        }).sort((a, b) => a.date.localeCompare(b.date));
    }

    // The termination endpoint does not allow cross-origin browser access.
    // A scheduled public snapshot preserves the exact series and its fetch time.
    function parseHistorySnapshot(payload) {
        if (!payload || payload.series !== "19x19" || !Array.isArray(payload.history)) {
            throw new Error("The global 19×19 history snapshot is unavailable.");
        }
        const updatedAt = new Date(payload.updatedAt);
        if (!Number.isFinite(updatedAt.getTime())) throw new Error("The rating history freshness is unavailable.");
        const history = payload.history.map(point => {
            const date = new Date(point && point.date);
            if (!point || typeof point.date !== "string" || typeof point.rating !== "number" || !Number.isFinite(point.rating) || !Number.isFinite(date.getTime())) {
                throw new Error("The rating history snapshot is incomplete.");
            }
            return { date: date.toISOString(), rating: point.rating };
        }).sort((a, b) => a.date.localeCompare(b.date));
        return { history, historyUpdatedAt: updatedAt.toISOString() };
    }

    async function request(url, format, fetchImpl, externalSignal) {
        const controller = new AbortController();
        const forwardAbort = () => controller.abort();
        if (externalSignal) {
            if (externalSignal.aborted) controller.abort();
            else externalSignal.addEventListener("abort", forwardAbort, { once: true });
        }
        const timeout = setTimeout(() => controller.abort(), 12000);
        try {
            const response = await fetchImpl(url, {
                credentials: "omit", mode: "cors", signal: controller.signal,
                headers: { Accept: format === "json" ? "application/json" : "text/tab-separated-values" },
            });
            if (!response.ok) throw new Error(`OGS returned HTTP ${response.status}.`);
            return await response[format]();
        } finally {
            clearTimeout(timeout);
            if (externalSignal) externalSignal.removeEventListener("abort", forwardAbort);
        }
    }

    async function loadRecentGames(fetchImpl, signal) {
        const games = [];
        const visited = new Set();
        let url = ENDPOINTS.games;
        while (url && games.length < 10) {
            if (visited.has(url)) throw new Error("OGS returned repeated recent-game pages.");
            visited.add(url);
            const payload = await request(url, "json", fetchImpl, signal);
            games.push(...parseGames(payload));
            if (games.length >= 10 || !payload.next) break;
            // Read another page when local cancellation filtering leaves fewer than ten games.
            const next = new URL(payload.next, ENDPOINTS.games);
            if (next.origin !== OGS_ORIGIN || next.pathname !== new URL(ENDPOINTS.games).pathname) {
                throw new Error("OGS returned an unexpected recent-game page.");
            }
            next.searchParams.set("annulled", "false");
            url = next.href;
        }
        return games.sort((a, b) => b.date.localeCompare(a.date)).slice(0, 10);
    }

    async function loadProfileData(options = {}) {
        const fetchImpl = options.fetchImpl || root.fetch.bind(root);
        const includeHistory = options.includeHistory !== false;
        const data = { username: null, dan: null, elo: null, games: null, history: null, historyUpdatedAt: null, errors: [] };
        const tasks = [
            ["profile", () => request(ENDPOINTS.profile, "json", fetchImpl, options.signal).then(parseProfile)],
            ["games", () => loadRecentGames(fetchImpl, options.signal)],
        ];
        if (includeHistory) tasks.push(["history", () => request(ENDPOINTS.history, "json", fetchImpl, options.signal).then(parseHistorySnapshot)]);
        const results = await Promise.allSettled(tasks.map(([, run]) => run()));
        results.forEach((result, index) => {
            const section = tasks[index][0];
            if (result.status === "fulfilled") {
                if (section === "profile" || section === "history") Object.assign(data, result.value);
                else data[section] = result.value;
            } else {
                data.errors.push({ section, message: result.reason instanceof Error ? result.reason.message : "OGS data is unavailable." });
            }
        });
        return data;
    }

    root.IconoclasteData = Object.freeze({ loadProfileData, rankLabel, parseProfile, parseGames, parseHistory, parseHistorySnapshot, endpoints: ENDPOINTS });
})(globalThis);
